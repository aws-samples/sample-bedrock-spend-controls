# GitHub keeps repository traffic (clones, views, referrers, paths) for 14
# days only. This workflow snapshots it weekly into the `traffic-stats`
# branch so the history survives; the branch holds data files only and is
# never merged.
#
# The traffic API requires push or admin access by a user; the workflow's own
# GITHUB_TOKEN is an installation token and GitHub answers it with 403, so
# the fetch step reads the repository secret TRAFFIC_TOKEN: a fine-grained
# personal access token scoped to this repository with the "Administration:
# read" permission (nothing else). Commits still use GITHUB_TOKEN.
name: Traffic snapshot

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the traffic-stats branch (created on first run)
        uses: actions/checkout@v4
        with:
          ref: traffic-stats
          fetch-depth: 0
        continue-on-error: true
        id: checkout

      - name: Create the branch when it does not exist yet
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Switch to an orphan traffic-stats branch
        if: steps.checkout.outcome == 'failure'
        run: |
          git checkout --orphan traffic-stats
          git rm -rf --quiet . || true
          printf '# Repository traffic snapshots\n\nWritten weekly by .github/workflows/traffic-snapshot.yml. Data files only.\n' > README.md

      - name: Fetch traffic from the GitHub API
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret TRAFFIC_TOKEN is not set; see the header comment of this workflow."
            exit 1
          fi
          mkdir -p traffic
          stamp="$(date -u +%Y-%m-%d)"
          for kind in clones views; do
            gh api "repos/$REPO/traffic/$kind" > "traffic/${kind}-${stamp}.json"
          done
          gh api "repos/$REPO/traffic/popular/referrers" > "traffic/referrers-${stamp}.json"
          gh api "repos/$REPO/traffic/popular/paths" > "traffic/paths-${stamp}.json"
          gh api "repos/$REPO" --jq '{stargazers_count, forks_count, subscribers_count, open_issues_count, pushed_at}' > "traffic/repo-${stamp}.json"
          # One CSV row per day, deduplicated across overlapping 14-day windows.
          python3 - <<'PY'
          import csv, glob, json, os
          rows = {}
          for kind in ("clones", "views"):
              for path in sorted(glob.glob(f"traffic/{kind}-*.json")):
                  for day in json.load(open(path)).get(kind, []):
                      key = day["timestamp"][:10]
                      rows.setdefault(key, {"date": key})
                      rows[key][f"{kind}"] = day["count"]
                      rows[key][f"{kind}_unique"] = day["uniques"]
          with open("traffic/daily.csv", "w", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=["date", "clones", "clones_unique", "views", "views_unique"])
              writer.writeheader()
              for key in sorted(rows):
                  writer.writerow({field: rows[key].get(field, "") for field in writer.fieldnames})
          print(f"{len(rows)} days in traffic/daily.csv")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Traffic snapshot $(date -u +%Y-%m-%d)"
          git push origin HEAD:traffic-stats
